<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nc-clock: independent stop</title>
  <style>
    body { font: 16px/1.4 system-ui, sans-serif; max-width: 34rem; margin: 3rem auto; padding: 0 1rem; color: #222; }
    button { font: inherit; padding: .4rem 1rem; margin-right: .5rem; }
    #status { color: #666; white-space: pre-line; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <h1>nc-clock: independent stop</h1>
  <p>Open this page in three tabs. Play joins the shared grid; Stop stops only this tab. The session ends with the
    last Stop. <code>test/e2e/three-tab.mjs</code> drives three of these through <code>window.ncE2E</code>.</p>
  <p><button id="play">Play</button><button id="stop">Stop</button></p>
  <div id="status">Not joined.</div>
  <p><small>nc-clock was created by <a href="https://psem.me/">Peter Semmelhack</a>.</small></p>
  <script type="module" src="./tab.js"></script>
</body>
</html>
